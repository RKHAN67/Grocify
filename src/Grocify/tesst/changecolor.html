<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Changer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">
  <div id="app" class="p-6 bg-white shadow-lg rounded-md">
    <h1 class="text-2xl font-semibold text-gray-700 mb-4">Change Background Color</h1>
    <input
      id="colorInput"
      type="text"
      placeholder="Enter color (e.g., red, #f00)"
      class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-300"
    />
    <button
      id="changeColorButton"
      class="mt-4 w-full bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600"
    >
      Change Color
    </button>
  </div>

  <script>
    const colorInput = document.getElementById("colorInput");
    const changeColorButton = document.getElementById("changeColorButton");

    changeColorButton.addEventListener("click", () => {
      const color = colorInput.value;
      document.body.style.backgroundColor = color;
    });
  </script>
</body>
</html>
