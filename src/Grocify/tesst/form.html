<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form with Page Redirect</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f2f5;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <!-- Form Page -->
  <div id="formPage" class="flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-md rounded-lg w-full max-w-md p-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">My Form</h1>
      <form id="hakForm">
        <!-- Name -->
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
          <input type="text" id="name" name="name"
            class="w-full p-3 border rounded-lg border-gray-300 focus:ring-gray-500 focus:outline-none">
          <p class="error-message text-red-600 text-xs mt-2 hidden">Please enter your name.</p>
        </div>
        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" name="email"
            class="w-full p-3 border rounded-lg border-gray-300 focus:ring-gray-500 focus:outline-none">
          <p class="error-message text-red-600 text-xs mt-2 hidden">Please enter a valid email.</p>
        </div>
        <!-- Submit Button -->
        <button type="submit"
          class="w-full py-3 text-white bg-gray-800 rounded-lg hover:bg-gray-900 transition-all duration-200">
          Submit
        </button>
      </form>
    </div>
  </div>

  <!-- Hak Page -->
  <div id="hakPage" class="hidden">
    <!-- Navbar -->
    <nav class="bg-gray-800 text-white">
      <div class="container mx-auto flex justify-between items-center py-4">
        <a href="#" class="text-xl font-bold">My Page</a>
        <ul class="flex space-x-4">
          <li><a href="#" class="hover:underline">Home</a></li>
          <li><a href="#" class="hover:underline">About</a></li>
          <li><a href="#" class="hover:underline">Contact</a></li>
        </ul>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="bg-gray-100 py-20">
      <div class="container mx-auto text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Welcome to My Page</h1>
        <p class="text-gray-600 text-lg">This is the hero section where you can add your main content or call-to-action.</p>
      </div>
    </section>

    <!-- Additional Section -->
    <section class="py-16 bg-white">
      <div class="container mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Additional Section</h2>
        <p class="text-gray-600 text-center">You can add more sections here as per your requirements.</p>
      </div>
    </section>
  </div>

  <script>
    const form = document.getElementById('hakForm');
    const formPage = document.getElementById('formPage');
    const hakPage = document.getElementById('hakPage');

    form.addEventListener('submit', function (e) {
      e.preventDefault(); // Prevent form submission

      // Validate Form
      const fields = ['name', 'email'];
      let isValid = true;

      fields.forEach(field => {
        const input = document.getElementById(field);
        const errorMessage = input.nextElementSibling;

        if (!input.value.trim()) {
          errorMessage.classList.remove('hidden'); // Show error
          input.classList.add('border-red-600'); // Highlight input
          isValid = false;
        } else {
          errorMessage.classList.add('hidden'); // Hide error
          input.classList.remove('border-red-600'); // Remove highlight
        }
      });

      // Show Hak Page if valid
      if (isValid) {
        formPage.classList.add('hidden'); // Hide Form Page
        hakPage.classList.remove('hidden'); // Show Hak Page
      }
    });
  </script>
</body>

</html>
